# Configuração para expor a API Laravel via http://localhost/fisio/api
# e o frontend React via http://localhost/fisio/app
# usando os servidores de desenvolvimento (npm run dev e php artisan serve)
#
# Instruções de instalação:
# 1. Substitua qualquer configuração antiga de /fisio no /opt/lampp/etc/httpd.conf
# 2. Reinicie o Apache do XAMPP
# 3. Inicie a API com: ./start-api.sh (na pasta /opt/lampp/htdocs/fisio)
# 4. Inicie o app com: ./start-app.sh (na pasta /opt/lampp/htdocs/fisio)
# 5. Acesse: http://localhost/fisio/api/health
# 6. Acesse: http://localhost/fisio/app/

ProxyPreserveHost On

# API Laravel
# Importante: mantém o prefixo /api/ para que as rotas do Laravel funcionem corretamente
ProxyPass /fisio/api/ http://127.0.0.1:8000/api/
ProxyPassReverse /fisio/api/ http://127.0.0.1:8000/api/

# Frontend React (Vite)
# A barra no final é importante. Passamos o prefixo completo para o Vite.
ProxyPass /fisio/app/ http://127.0.0.1:5173/fisio/app/
ProxyPassReverse /fisio/app/ http://127.0.0.1:5173/fisio/app/
