# CloudPanel Custom Vhost snippet para fisio.patropicomunica.com.br
# Arquitetura A2: domínio único, React SPA em / e API Laravel em /api/
#
# Como usar:
# 1. No CloudPanel, crie um "PHP Site" para fisio.patropicomunica.com.br.
# 2. Defina a raiz (root) do site como:
#    /home/patropicomunica-fisio/htdocs/fisio.patropicomunica.com.br/api/public
# 3. Envie o projeto para /home/patropicomunica-fisio/htdocs/fisio.patropicomunica.com.br
#    e copie o build do frontend (app/dist) para dentro de api/public.
# 4. Vá em Sites > fisio.patropicomunica.com.br > Custom Vhost.
# 5. Cole o conteúdo abaixo no campo de vhost customizado.
# 6. Ative o SSL (Let's Encrypt) e reinicie o Nginx.

index index.html index.php;

# Frontend React SPA: qualquer rota desconhecida cai no index.html
location / {
    try_files $uri $uri/ /index.html;
}

# API Laravel: rotas /api/* caem no index.php do Laravel
location /api/ {
    try_files $uri $uri/ /index.php?$query_string;
}

# Health check nativo do Laravel 11 (rota /up)
location /up {
    try_files $uri /index.php?$query_string;
}
