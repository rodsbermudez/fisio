# CloudPanel vhost completo para fisio.patropicomunica.com.br
# Arquitetura A2: domínio único, React SPA em / e API Laravel em /api/
# Compatível com o Varnish padrão do CloudPanel.
#
# 1. Crie um "PHP Site" para fisio.patropicomunica.com.br.
# 2. Defina a raiz (root) do site como:
#    /home/patropicomunica-fisio/htdocs/fisio.patropicomunica.com.br/api/public
# 3. Envie o projeto para /home/patropicomunica-fisio/htdocs/fisio.patropicomunica.com.br
#    e copie o build do frontend (app/dist) para dentro de api/public.
# 4. Substitua todo o conteúdo do vhost pelo código abaixo.
# 5. Ative o SSL (Let's Encrypt) e reinicie o Nginx.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name fisio.patropicomunica.com.br;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  # Proxy everything to Varnish (which talks to the 8080 backend).
  location / {
    {{varnish_proxy_pass}}
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map|mjs)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
  }

  location ~ /\.(ht|svn|git) {
    deny all;
  }

  if (-f $request_filename) {
    break;
  }
}

# Backend (port 8080) — Varnish fetches from here.
server {
  listen 8080;
  listen [::]:8080;
  server_name fisio.patropicomunica.com.br;
  {{root}}

  include /etc/nginx/global_settings;

  index index.html index.php;

  # Frontend React SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Laravel API
  location /api/ {
    try_files $uri $uri/ /index.php?$query_string;
  }

  # Laravel health check (route /up)
  location /up {
    try_files $uri /index.php?$query_string;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  if (-f $request_filename) {
    break;
  }
}
